<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагувати кандидата</title>
</head>
<body>
    <h1>Редагувати кандидата</h1>

    <form method="post">
        <p>
            <label>ПІБ:</label><br>
            <input type="text" name="full_name" value="{{ candidate.full_name }}" required>
        </p>

        <p>
            <label>Email:</label><br>
            <input type="email" name="email" value="{{ candidate.email }}" required>
        </p>

        <p>
            <label>Бажана позиція:</label><br>
            <input type="text" name="desired_position" value="{{ candidate.desired_position }}">
        </p>

        <p>
            <label>Навички:</label><br>
            <textarea name="skills">{{ candidate.skills }}</textarea>
        </p>

        <p>
            <label>Досвід:</label><br>
            <textarea name="experience">{{ candidate.experience }}</textarea>
        </p>

        <p>
            <label>Посилання на резюме:</label><br>
            <input type="text" name="resume_url" value="{{ candidate.resume_url }}">
        </p>

        <p>
            <label>Відгук після інтерв'ю:</label><br>
            <textarea name="interview_feedback">{{ candidate.interview_feedback }}</textarea>
        </p>

        <p>
            <label>Технічна оцінка:</label><br>
            <input type="number" step="0.1" name="technical_score" value="{{ candidate.technical_score }}">
        </p>

        <p>
            <label>
                <input type="checkbox" name="is_recommended" {% if candidate.is_recommended %}checked{% endif %}>
                Рекомендований до найму
            </label>
        </p>

        <button type="submit">Оновити</button>
    </form>

    <p>
        <a href="/candidates">Назад до списку</a>
    </p>
</body>
</html>
