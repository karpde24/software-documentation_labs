<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати кандидата</title>
</head>
<body>
    <h1>Додати кандидата</h1>

    <form method="post">
        <p>
            <label>ПІБ:</label><br>
            <input type="text" name="full_name" required>
        </p>

        <p>
            <label>Email:</label><br>
            <input type="email" name="email" required>
        </p>

        <p>
            <label>Бажана позиція:</label><br>
            <input type="text" name="desired_position">
        </p>

        <p>
            <label>Навички:</label><br>
            <textarea name="skills"></textarea>
        </p>

        <p>
            <label>Досвід:</label><br>
            <textarea name="experience"></textarea>
        </p>

        <p>
            <label>Посилання на резюме:</label><br>
            <input type="text" name="resume_url">
        </p>

        <p>
            <label>Відгук після інтерв'ю:</label><br>
            <textarea name="interview_feedback"></textarea>
        </p>

        <p>
            <label>Технічна оцінка:</label><br>
            <input type="number" step="0.1" name="technical_score">
        </p>

        <p>
            <label>
                <input type="checkbox" name="is_recommended">
                Рекомендований до найму
            </label>
        </p>

        <button type="submit">Зберегти</button>
    </form>

    <p>
        <a href="/candidates">Назад до списку</a>
    </p>
</body>
</html>
